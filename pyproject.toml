[project]
name = "autodo-engine"
version = "0.4.0"
description = "工具包：用于按通用的任务事务工作流程系统的引擎。"
authors = [
    { name = "Ethan Lin", email = "ElementsPhoenix@outlook.com" },
]
requires-python = ">=3.14"
dependencies = [
    "bibtexparser>=1.4.0",
    "pandas>=3.0.1",
    "dashscope>=1.20.0",
    "openai>=1.40.0",
    "simpleeval>=0.9.13",
    "playwright>=1.58.0",
    "jinja2>=3.1.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["autodoengine*"]
exclude = ["demos*", "docs*", "config*", "flowgraphs*", "nodes*"]

[project.scripts]
# 在安装后可通过 `aok` 命令运行主入口
aok = "autodoengine.main:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
# 只从 tests/ 收集用例；scripts/ 下是可运行脚本（如 run_sandbox_test.py 会在导入期 sys.exit），不是 pytest 测试。
testpaths = ["tests"]
markers = [
    "smoke: 冒烟测试——最小可导入性/存活契约，CI 必跑门",
]
